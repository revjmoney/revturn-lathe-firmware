<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <!-- REVTURN on the S9: wiring. Pins from s9/fpga/pins.xdc and Orphan's docs/pinmap.md. by JMSCNC. GPL-3.0-or-later -->
  <rect width="1000" height="770" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111">REVTURN on the S9: wiring</text>
  <text x="20" y="50" fill="#555">Header pins 5, 11, 12, 15 are FPGA pins, 3.3 V, not 5 V tolerant. GND = header pins 1, 2, 9, 10, 13, 14. 3.3 V out = pin 16. Leave pin 18 (EN) open.</text>

  <!-- S9 board -->
  <rect x="20" y="70" width="300" height="690" rx="8" fill="#eef3f8" stroke="#345" stroke-width="2"/>
  <text x="35" y="95" font-size="16" font-weight="bold" fill="#123">Antminer S9 control board</text>
  <text x="35" y="112" fill="#456">Orphan, core orphan_revturn</text>

  <g fill="#fff" stroke="#345">
    <rect x="35" y="125" width="270" height="110" rx="4"/>
    <rect x="35" y="245" width="270" height="110" rx="4"/>
    <rect x="35" y="365" width="270" height="110" rx="4"/>
    <rect x="35" y="485" width="270" height="110" rx="4"/>
    <rect x="35" y="605" width="270" height="130" rx="4"/>
  </g>
  <g fill="#111">
    <text x="45" y="145" font-weight="bold">J6 (fitted)</text>
    <text x="45" y="167">pin 5   X step   (U14)</text>
    <text x="45" y="187">pin 11  X dir    (U18)</text>
    <text x="45" y="207">pin 12  Z step   (U19)</text>
    <text x="45" y="227">pin 15  Z dir    (U15)</text>

    <text x="45" y="265" font-weight="bold">J7 (fitted)</text>
    <text x="45" y="287">pin 5   C step   (T20)</text>
    <text x="45" y="307">pin 11  C dir    (V20)</text>
    <text x="45" y="327" fill="#888">pin 12  W step   (W20) not used yet</text>
    <text x="45" y="347" fill="#888">pin 15  W dir    (U20) not used yet</text>

    <text x="45" y="385" font-weight="bold">J8 (fitted)</text>
    <text x="45" y="407">pin 5   X enable (Y18)</text>
    <text x="45" y="427" fill="#888">pin 11  spindle 1 PWM (V16) not used yet</text>
    <text x="45" y="447">pin 12  Z enable (W16)</text>
    <text x="45" y="467">pin 15  C enable (Y19)</text>

    <text x="45" y="505" font-weight="bold">J9 (solder a 2x9 header)</text>
    <text x="45" y="527">pin 5   limit X  (R16)</text>
    <text x="45" y="547">pin 11  limit Z  (T17)</text>
    <text x="45" y="567">pin 12  probe    (R18)</text>
    <text x="45" y="587">pin 15  e-stop   (R17)</text>

    <text x="45" y="625" font-weight="bold">J1 (solder a 2x9 header)</text>
    <text x="45" y="647">pin 5   feed hold   (T11)</text>
    <text x="45" y="667">pin 11  cycle start (T12)</text>
    <text x="45" y="687">pin 12  reset       (U12)</text>
    <text x="45" y="707">pin 15  limit W     (T10)</text>
    <text x="45" y="727" font-weight="bold">J2 (solder a header): pin 5 W enable (R19)</text>
  </g>

  <!-- buffer -->
  <rect x="420" y="125" width="170" height="355" rx="6" fill="#fff6e6" stroke="#a60" stroke-width="2"/>
  <text x="435" y="150" font-size="15" font-weight="bold" fill="#730">3.3 V to 5 V buffer</text>
  <text x="435" y="250" fill="#730">e.g. 74HCT245 / 74HCT541</text>
  <text x="435" y="272" fill="#730">VCC = +5 V</text>
  <text x="435" y="294" fill="#730">GND = S9 GND (pin 1)</text>
  <text x="435" y="465" fill="#a60" font-style="italic">suggested, not yet tested</text>

  <g stroke="#245" stroke-width="2" fill="none">
    <path d="M305 167 H420"/><path d="M305 187 H420"/><path d="M305 207 H420"/><path d="M305 227 H420"/>
    <path d="M305 287 H420"/><path d="M305 307 H420"/>
    <path d="M305 407 H420"/><path d="M305 447 H420"/><path d="M305 467 H420"/>
  </g>

  <!-- drivers -->
  <g fill="#eef8ee" stroke="#262" stroke-width="2">
    <rect x="700" y="120" width="270" height="90" rx="6"/>
    <rect x="700" y="220" width="270" height="90" rx="6"/>
    <rect x="700" y="320" width="270" height="90" rx="6"/>
  </g>
  <g fill="#131">
    <text x="715" y="142" font-weight="bold">X driver (TB6600)</text>
    <text x="715" y="162">PUL- &#8592; X step   DIR- &#8592; X dir</text>
    <text x="715" y="182">ENA- &#8592; X enable</text>
    <text x="715" y="200">PUL+ DIR+ ENA+ &#8592; +5 V</text>
    <text x="715" y="242" font-weight="bold">Z driver (TB6600)</text>
    <text x="715" y="262">PUL- &#8592; Z step   DIR- &#8592; Z dir</text>
    <text x="715" y="282">ENA- &#8592; Z enable</text>
    <text x="715" y="300">PUL+ DIR+ ENA+ &#8592; +5 V</text>
    <text x="715" y="342" font-weight="bold">C driver, the chuck (TB6600)</text>
    <text x="715" y="362">PUL- &#8592; C step   DIR- &#8592; C dir</text>
    <text x="715" y="382">ENA- &#8592; C enable</text>
    <text x="715" y="400">PUL+ DIR+ ENA+ &#8592; +5 V</text>
  </g>
  <g stroke="#262" stroke-width="2" fill="none">
    <path d="M590 165 H700"/><path d="M590 265 H700"/><path d="M590 365 H700"/>
  </g>
  <text x="600" y="155" fill="#262" font-size="11">X step / dir / enable</text>
  <text x="600" y="255" fill="#262" font-size="11">Z step / dir / enable</text>
  <text x="600" y="355" fill="#262" font-size="11">C step / dir / enable</text>
  <text x="700" y="430" fill="#555" font-size="12">Common anode, as on the ESP32 REVTURN.</text><text x="700" y="464" fill="#555" font-size="12">One enable per driver ($4 polarity per axis).</text><text x="700" y="447" fill="#555" font-size="12">Step / dir polarity: $2 / $3.</text>

  <!-- switches -->
  <rect x="420" y="505" width="550" height="210" rx="6" fill="#f6f0fa" stroke="#536" stroke-width="2"/>
  <text x="435" y="530" font-size="15" font-weight="bold" fill="#324">Switches: each one between its pin and GND</text>
  <g fill="#213">
    <text x="435" y="555">FPGA pull-ups are on (PULLTYPE PULLUP): no resistor needed.</text>
    <text x="435" y="577">Normally-open switch to GND: leave its invert bit 0 (active when closed).</text>
    <text x="435" y="599">Normally-closed (better for limits and e-stop): set its invert bit</text>
    <text x="455" y="619">$5 limits, $6 probe, $14 e-stop / hold / start / reset.</text>
    <text x="435" y="641">E-stop always freezes the steps inside the FPGA; limits do when hard limits ($21) are on.</text>
    <text x="435" y="663">Long wires near motors: optional 4.7 k to 10 k pull-up to pin 16 (3.3 V).</text>
    <text x="435" y="685">Debounce: 500 microseconds, in the FPGA.</text>
  </g>
  <g stroke="#536" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M305 550 H420"/><path d="M305 670 H420"/>
  </g>
</svg>
